<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>暗棋連吃 · 聲光對決版</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap');

  :root {
    --bg-dark: #160e0a;
    --wood-board: #d2a679;
    --wood-border: #6b4423;
    --wood-panel: #2b1c13;
    --text-light: #f4ecd8;
    --red-piece: #a72626;
    --black-piece: #111111;
    --highlight: #e9c46a;
    --danger: #e76f51;
  }

  * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body {
    height: 100%; 
    height: 100dvh; 
    margin: 0; padding: 0;
  }

  body {
    background-color: var(--bg-dark);
    background-image: radial-gradient(circle at center, #2b1c13 0%, #160e0a 100%);
    font-family: 'Noto Serif TC', serif;
    display: flex; flex-direction: column; color: var(--text-light); overflow: hidden;
  }

  /* 頂部操作按鈕 (音效與離開) */
  #topControls {
    position: fixed; top: 10px; right: 15px; display: flex; gap: 10px; z-index: 1000;
  }
  .btn-top {
    width: 40px; height: 40px; background: rgba(43, 28, 19, 0.9); border: 2px solid var(--wood-border);
    border-radius: 50%; color: #fff; font-size: 18px; display: flex;
    align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }
  #btnLeave { display: none; background: rgba(139, 58, 43, 0.9); border-color: #5c2419; }

  /* ---- 大廳介面 ---- */
  #lobby {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(22, 14, 10, 0.95); display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100;
  }
  .lobby-card {
    background: var(--wood-panel); border: 2px solid var(--wood-border); border-radius: 12px;
    padding: 30px 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 90%; max-width: 360px;
  }
  .lobby-title { font-size: 28px; margin-bottom: 24px; color: var(--highlight); letter-spacing: 2px; }
  .lobby-input {
    width: 100%; padding: 12px; font-size: 18px; text-align: center;
    border: 1px solid var(--wood-border); border-radius: 6px;
    background: #f4ecd8; color: #000; font-weight: 900; margin-bottom: 20px;
  }
  .btn {
    width: 100%; padding: 12px; font-size: 16px; font-weight: bold; background: #8b3a2b; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; font-family: inherit; box-shadow: 0 4px 0 #5c2419;
  }
  .btn:active { transform: translateY(4px); box-shadow: none; }
  .btn:disabled { background: #555; box-shadow: 0 4px 0 #333; cursor: not-allowed; }
  .btn-share { background: #5c3a21; box-shadow: 0 4px 0 #3a2212; }
  .btn-cancel { background: #444; box-shadow: 0 4px 0 #222; display: none; margin-top: 10px; }
  #lobbyMsg { margin-top: 16px; font-size: 14px; color: #aaa; min-height: 20px; }

  /* ---- 遊戲主介面 ---- */
  #gameApp {
    display: none; flex-direction: column; height: 100%; width: 100%;
    max-width: 900px; margin: 0 auto; 
    padding: 55px 8px 15px 8px; 
    box-sizing: border-box;
    justify-content: space-between;
    gap: 8px;
  }

  /* 🔥 橫向螢幕終極優化 (左右兩欄排版) */
  @media (max-height: 600px) and (orientation: landscape) {
    #gameApp {
      display: grid !important; 
      grid-template-columns: 280px 1fr; 
      grid-template-rows: 1fr auto 1fr; 
      gap: 10px;
      padding: 10px;
      align-items: center;
    }
    
    #topControls { top: 10px; right: 10px; }
    .btn-top { width: 35px; height: 35px; font-size: 16px; }

    #panelOpponent { grid-column: 1; grid-row: 1; align-self: start; }
    .action-bar { grid-column: 1; grid-row: 2; align-self: center; justify-content: center; }
    #panelMe { grid-column: 1; grid-row: 3; align-self: end; }

    .board-wrapper {
      grid-column: 2; grid-row: 1 / 4;
      height: 100%; width: 100%;
      padding: 0; display: flex; align-items: center; justify-content: center;
    }
  }

  /* 玩家面板 */
  .player-panel {
    background: rgba(43, 28, 19, 0.85); border: 1px solid var(--wood-border); border-radius: 6px;
    padding: 8px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); flex-shrink: 0;
  }
  
  @keyframes activePanelPulse {
    0% { box-shadow: 0 0 10px rgba(233,196,106,0.3); border-color: #8c5e37; background: rgba(50,30,20,0.85); }
    50% { box-shadow: 0 0 20px rgba(233,196,106,0.8); border-color: var(--highlight); background: rgba(80,40,20,0.95); }
    100% { box-shadow: 0 0 10px rgba(233,196,106,0.3); border-color: #8c5e37; background: rgba(50,30,20,0.85); }
  }
  .player-panel.active-turn { animation: activePanelPulse 1.5s infinite; }

  .turn-indicator { color: var(--highlight); font-weight: 900; font-size: 13px; display: none; animation: blink 1s infinite alternate; }
  .active-turn .turn-indicator { display: inline; }
  @keyframes blink { from { opacity: 0.4; } to { opacity: 1; text-shadow: 0 0 5px var(--highlight); } }

  .player-info { display: flex; justify-content: space-between; align-items: center; font-size: 14px; letter-spacing: 1px; }
  
  .role-badge {
    padding: 4px 8px; border-radius: 4px; font-size: 13px; font-weight: 900; background: #111; color: #fff; border: 1px solid #444; margin-right: 6px;
  }
  .role-badge.red { background: #5c1818; color: #f4ecd8; border-color: var(--red-piece); }
  .role-badge.black { background: #1a1a1a; color: #f4ecd8; border-color: #444; }
  
  .btn-small {
    background: #5c3a21; color: #fff; border: 1px solid #3a2212; border-radius: 4px;
    padding: 4px 10px; font-size: 13px; cursor: pointer; font-weight: bold; box-shadow: 0 2px 0 #3a2212;
  }
  .btn-small:active { transform: translateY(2px); box-shadow: none; }
  .btn-small.btn-danger { background: #8b3a2b; border-color: #5c2419; box-shadow: 0 2px 0 #5c2419; }

  .captured-tray {
    display: flex; flex-wrap: wrap; gap: 4px; min-height: 28px; background: rgba(0,0,0,0.3); padding: 4px; border-radius: 4px;
  }
  .captured-item {
    display: flex; align-items: center; justify-content: center; background: #e8d8c8; border-radius: 4px;
    padding: 2px 6px; font-size: 13px; font-weight: 900; box-shadow: 1px 1px 3px rgba(0,0,0,0.5);
  }
  .captured-item.red { color: var(--red-piece); }
  .captured-item.black { color: var(--black-piece); }

  /* 🎯 棋盤佈局完美縮放 */
  .board-wrapper { 
    flex: 1 1 0; 
    display: flex; align-items: center; justify-content: center; 
    width: 100%; min-height: 0; 
  }
  .board-container {
    background: var(--wood-board); border: 3px solid var(--wood-border); border-radius: 6px;
    padding: 4px; box-shadow: inset 0 0 15px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.8);
    aspect-ratio: 2 / 1;
    width: 100%;
    max-height: 100%;
    max-width: calc(100vh * 2); 
    margin: 0 auto; 
    display: flex;
  }
  .board { 
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(4, 1fr); 
    gap: 2px; width: 100%; height: 100%; 
  }
  .cell {
    position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    border: 1px dashed rgba(107, 68, 35, 0.3);
  }
  .cell::after { content: ''; position: absolute; width: 4px; height: 4px; background: rgba(107, 68, 35, 0.5); border-radius: 50%; z-index: 0; }

  /* 保證棋子為正圓形 */
  .piece {
    width: 85%; height: 85%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: clamp(12px, 3.5vmin, 26px); font-weight: 900; cursor: pointer; position: relative; z-index: 1;
    box-shadow: 2px 3px 5px rgba(0,0,0,0.5); transition: transform 0.1s, box-shadow 0.1s;
    aspect-ratio: 1 / 1;
  }
  .piece.hidden { background: radial-gradient(circle at 35% 35%, #966741, #5c3a21); border: 1.5px solid #3d2314; }
  .piece.revealed { background: radial-gradient(circle at 35% 35%, #fff7e6, #d8c2aa); border: 1.5px solid #6b4423; }
  .piece.red { color: var(--red-piece); text-shadow: 0 0 1px rgba(184,42,42,0.2); }
  .piece.black { color: var(--black-piece); text-shadow: 0 0 1px rgba(0,0,0,0.2); }

  .piece.last-move::before {
    content: '⭐'; position: absolute; top: -6px; right: -6px; font-size: 15px;
    z-index: 5; text-shadow: 0 0 4px #000; animation: starPulse 0.8s infinite alternate;
  }
  @keyframes starPulse { from { transform: scale(1); } to { transform: scale(1.3); } }

  .piece.selected { transform: scale(1.15); box-shadow: 0 0 0 2px var(--highlight), 0 4px 10px rgba(0,0,0,0.6); z-index: 3; }
  .piece.combo-active { box-shadow: 0 0 0 2px var(--danger), 0 0 12px var(--danger); animation: pulseCombo 1s infinite alternate; }
  .piece.combat-attacker { box-shadow: 0 0 0 3px #e9c46a, 0 0 15px #e9c46a !important; transform: scale(1.15); z-index: 4; }
  .piece.combat-defender { box-shadow: 0 0 0 3px var(--danger), 0 0 15px var(--danger) !important; transform: scale(1.15); z-index: 4; animation: shake 0.3s infinite; }

  @keyframes pulseCombo { 0% { transform: scale(1.1); box-shadow: 0 0 0 2px var(--danger), 0 0 10px var(--danger); } 100% { transform: scale(1.15); box-shadow: 0 0 0 3px var(--danger), 0 0 20px var(--danger); } }
  @keyframes shake { 0%, 100% { transform: scale(1.15) translateX(0); } 25% { transform: scale(1.15) translateX(-2px) rotate(-3deg); } 75% { transform: scale(1.15) translateX(2px) rotate(3deg); } }

  .cell.target-move::after { width: 25%; height: 25%; background: rgba(233, 196, 106, 0.9); box-shadow: 0 0 8px var(--highlight); z-index: 2; cursor: pointer; }
  .cell.target-capture::after { width: 100%; height: 100%; background: rgba(231, 111, 81, 0.4); border-radius: 50%; box-shadow: inset 0 0 10px var(--danger); z-index: 2; cursor: pointer; }

  .action-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; min-height: 40px; flex-shrink: 0; }
  .status-text { font-size: 15px; font-weight: bold; color: var(--highlight); }
  
  .btn-combo-end { background: var(--danger); color: #fff; padding: 8px 16px; font-size: 14px; border: none; border-radius: 6px; font-weight: 900; box-shadow: 0 3px 0 #9d3b24; cursor: pointer; display: none; animation: popIn 0.3s; }
  .btn-combo-end:active { transform: translateY(3px); box-shadow: none; }
  @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .sys-modal {
    display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(20,20,20,0.95); border: 2px solid var(--highlight); padding: 25px;
    border-radius: 8px; z-index: 250; text-align: center; box-shadow: 0 0 30px #000; width: 85%; max-width: 320px;
  }
  .sys-modal h2 { color: var(--highlight); margin-bottom: 10px; font-size: 22px;}
  #rematchStatus { font-size: 14px; color: #ccc; margin-bottom: 20px; height: 20px; }

  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(231, 111, 81, 0.95);
    color: #fff; padding: 12px 20px; border-radius: 20px; font-weight: bold; z-index: 400; font-size: 15px;
    display: none; opacity: 0; transition: opacity 0.3s; box-shadow: 0 4px 15px rgba(0,0,0,0.6); text-align: center; width: 90%; max-width: 300px;
  }

  #rpsModal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.95); z-index: 300; flex-direction: column; align-items: center; justify-content: center; color: #fff;
  }
  .rps-box { text-align: center; }
  .rps-icon { font-size: 45px; width: 80px; height: 80px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px #000; border: 2px solid #444; margin-top: 10px; }
  .rps-vs { font-size: 24px; font-weight: bold; color: var(--danger); margin: 0 20px; padding-top: 35px;}
</style>
</head>
<body>

<!-- 頂部操作區 -->
<div id="topControls">
  <div id="btnLeave" class="btn-top" onclick="confirmLeave()" title="離開房間">🚪</div>
  <div id="btnAudio" class="btn-top" onclick="toggleAudio()" style="position:static;" title="音效開關">🎵</div>
</div>

<div id="lobby">
  <div class="lobby-card">
    <div class="lobby-title">暗棋連吃對決</div>
    <input type="text" id="roomId" class="lobby-input" placeholder="自訂房號 (也可直接分享)" maxlength="8">
    <div id="lobbyActions" style="display:flex; gap:10px; justify-content: center; flex-direction: column;">
      <div style="display:flex; gap:10px;">
        <button id="btnConnect" class="btn" onclick="joinRoom()">進入對戰</button>
        <button id="btnShare" class="btn btn-share" onclick="shareRoom()">🔗 傳給朋友</button>
      </div>
      <button id="btnCancel" class="btn btn-cancel" onclick="cancelRoom()">取消連線重選</button>
    </div>
    <div id="lobbyMsg"></div>
  </div>
</div>

<div id="rpsModal">
  <h2 style="color:var(--highlight); margin-bottom:30px; font-size:26px;">系統猜拳決定先手</h2>
  <div style="display:flex; align-items:flex-start; margin-bottom:30px;">
     <div class="rps-box"><div style="font-size:16px;">房主</div><div id="rpsHost" class="rps-icon">✊</div></div>
     <div class="rps-vs">VS</div>
     <div class="rps-box"><div style="font-size:16px;">棋客</div><div id="rpsGuest" class="rps-icon">✌️</div></div>
  </div>
  <div id="rpsResult" style="font-size:22px; font-weight:bold; color:var(--highlight); height:30px; letter-spacing:1px;"></div>
</div>

<div id="gameApp">
  <div class="player-panel" id="panelOpponent">
    <div class="player-info">
      <div><span id="oppRoleBadge" class="role-badge">對手 (未定)</span></div>
      <div><span class="turn-indicator">🔥 行動中</span></div>
    </div>
    <div class="captured-tray" id="oppCaptured"></div>
  </div>
  
  <div class="board-wrapper">
    <div class="board-container"><div class="board" id="board"></div></div>
  </div>
  
  <div class="action-bar">
    <div class="status-text" id="gameStatus">初始化中...</div>
    <button id="btnComboEnd" class="btn-combo-end" onclick="manualEndCombo()">放棄連吃</button>
  </div>
  
  <div class="player-panel" id="panelMe">
    <div class="player-info">
      <div>
        <span id="myRoleBadge" class="role-badge">我方 (未定)</span>
        <span style="margin-right:6px;">您</span>
        <span class="turn-indicator">🔥 行動中</span>
      </div>
      <div id="myActionBtns" style="display:flex; gap:6px; display:none;">
        <button class="btn-small" onclick="proposeDraw()">🤝 求和</button>
        <button class="btn-small btn-danger" onclick="confirmResign()">🏳️ 認輸</button>
      </div>
    </div>
    <div class="captured-tray" id="myCaptured"></div>
  </div>
</div>

<div id="sysModal" class="sys-modal">
  <h2 id="sysModalTitle">遊戲結束</h2>
  <div id="rematchStatus">等待選擇...</div>
  <div style="display:flex; gap:10px; justify-content: center;">
    <button id="btnRematch" class="btn" onclick="requestRematch()">再來一局</button>
    <button class="btn" style="background:#555; box-shadow: 0 4px 0 #333;" onclick="confirmLeave()">離開</button>
  </div>
</div>

<div id="requestModal" class="sys-modal">
  <h2 id="requestTitle">提示</h2>
  <p id="requestText" style="margin-bottom:20px; font-size:16px;">是否同意？</p>
  <div style="display:flex; gap:10px; justify-content: center;">
    <button class="btn" id="btnReqYes">確定</button>
    <button class="btn" style="background:#555; box-shadow: 0 4px 0 #333;" id="btnReqNo">取消</button>
  </div>
</div>

<div id="toast"></div>

<script>
/** 音效引擎 (Web Audio API) **/
const actx = new (window.AudioContext || window.webkitAudioContext)();
let audioEnabled = true;

document.body.addEventListener('click', () => { if (actx.state === 'suspended') actx.resume(); }, { once: true });

const SFX = {
  playTone(freq, type, dur, vol = 0.1, slideFreq = null) {
    if (!audioEnabled) return;
    if (actx.state === 'suspended') actx.resume();
    let osc = actx.createOscillator(), gain = actx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, actx.currentTime);
    if(slideFreq) osc.frequency.exponentialRampToValueAtTime(slideFreq, actx.currentTime + dur);
    gain.gain.setValueAtTime(vol, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + dur);
  },
  flip() { this.playTone(350, 'sine', 0.1, 0.2); },       
  move() { this.playTone(450, 'triangle', 0.1, 0.15); },  
  capture() { this.playTone(800, 'square', 0.1, 0.1); this.playTone(600, 'sawtooth', 0.15, 0.1); },
  captureBig() { this.playTone(150, 'square', 0.4, 0.3); this.playTone(100, 'sawtooth', 0.5, 0.2); },
  combo() { 
    if (!audioEnabled) return; if (actx.state === 'suspended') actx.resume();
    let time = actx.currentTime;
    [440, 493.88, 587.33, 659.25, 880].forEach((f, i) => { 
       let osc = actx.createOscillator(), gain = actx.createGain();
       osc.type = 'sine'; osc.frequency.value = f;
       gain.gain.setValueAtTime(0.15, time + i*0.06); gain.gain.exponentialRampToValueAtTime(0.01, time + i*0.06 + 0.15);
       osc.connect(gain); gain.connect(actx.destination);
       osc.start(time + i*0.06); osc.stop(time + i*0.06 + 0.15);
    });
  },
  fail() { this.playTone(200, 'sawtooth', 0.4, 0.2, 100); }, 
  win() { 
    if (!audioEnabled) return; let time = actx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach(f => {
       let osc = actx.createOscillator(), gain = actx.createGain();
       osc.type = 'triangle'; osc.frequency.value = f;
       gain.gain.setValueAtTime(0.15, time); gain.gain.exponentialRampToValueAtTime(0.01, time + 1.5);
       osc.connect(gain); gain.connect(actx.destination); osc.start(time); osc.stop(time + 1.5);
    });
  },
  lose() { this.playTone(300, 'sawtooth', 1.2, 0.2, 100); },  
  
  play(name, broadcast = false) {
    if (this[name]) this[name]();
    if (broadcast && localUI.conn && localUI.conn.open) localUI.conn.send({ type: 'SFX', sound: name });
  }
};

function toggleAudio() {
  audioEnabled = !audioEnabled;
  if(audioEnabled) {
    if (actx.state === 'suspended') actx.resume();
    document.getElementById('btnAudio').innerText = '🎵';
    SFX.playTone(600, 'sine', 0.1, 0.1); 
  } else { document.getElementById('btnAudio').innerText = '🔇'; }
}

const PIECE_DEFS = [
  { name: '帥', color: 'red', rank: 7, count: 1 }, { name: '仕', color: 'red', rank: 6, count: 2 },
  { name: '相', color: 'red', rank: 5, count: 2 }, { name: '俥', color: 'red', rank: 4, count: 2 },
  { name: '傌', color: 'red', rank: 3, count: 2 }, { name: '炮', color: 'red', rank: 2, count: 2, isCannon: true },
  { name: '兵', color: 'red', rank: 1, count: 5 },
  { name: '將', color: 'black', rank: 7, count: 1 }, { name: '士', color: 'black', rank: 6, count: 2 },
  { name: '象', color: 'black', rank: 5, count: 2 }, { name: '車', color: 'black', rank: 4, count: 2 },
  { name: '馬', color: 'black', rank: 3, count: 2 }, { name: '包', color: 'black', rank: 2, count: 2, isCannon: true },
  { name: '卒', color: 'black', rank: 1, count: 5 }
];

let gameState = {
  matchId: null, phase: 'LOBBY', board: [], dead: { red: {}, black: {} }, turn: null, firstPlayer: null, roles: { host: null, guest: null }, 
  combo: { active: false, idx: null }, combat: null, lastMoveTarget: null, winner: null, rematch: { host: false, guest: false }
};

let localUI = { isHost: false, peer: null, conn: null, selectedIndex: null, locked: false, currentMatchId: null, gameOverSoundPlayed: false, isConnecting: false };

window.addEventListener('DOMContentLoaded', () => {
  const urlParams = new URLSearchParams(window.location.search);
  const room = urlParams.get('room');
  if (room) { document.getElementById('roomId').value = room; joinRoom(); }
});

function initGame() {
  let list = [];
  PIECE_DEFS.forEach(p => { for (let i = 0; i < p.count; i++) list.push({ ...p, revealed: false }); });
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  
  gameState.matchId = Date.now(); gameState.phase = 'LOBBY'; gameState.board = list; gameState.dead = { red: {}, black: {} };
  gameState.turn = null; gameState.firstPlayer = null; gameState.roles = { host: null, guest: null };
  gameState.combo = { active: false, idx: null }; gameState.combat = null; gameState.lastMoveTarget = null;
  gameState.winner = null; gameState.rematch = { host: false, guest: false };
  localUI.gameOverSoundPlayed = false;
}

function cancelRoom() {
  if (localUI.peer) { localUI.peer.destroy(); localUI.peer = null; }
  localUI.isConnecting = false;
  document.getElementById('btnConnect').style.display = 'block';
  document.getElementById('btnShare').style.display = 'block';
  document.getElementById('btnCancel').style.display = 'none';
  document.getElementById('lobbyMsg').innerText = "已取消連線，可重新輸入房號";
}

function shareRoom() {
  if (actx.state === 'suspended') actx.resume();
  let code = document.getElementById('roomId').value.trim();
  if (!code) { code = Math.floor(1000 + Math.random() * 9000).toString(); document.getElementById('roomId').value = code; }
  
  const url = window.location.origin + window.location.pathname + '?room=' + code;
  const shareData = { title: '暗棋連吃對決', text: '來跟我下盤刺激的暗棋連吃！點擊連結自動加入：', url: url };

  if (!localUI.isConnecting) joinRoom();

  if (navigator.share) { 
    navigator.share(shareData).then(() => showToast("已開啟分享選單！")).catch((err) => { if(err.name !== "AbortError") fallbackCopy(url); });
  } else { fallbackCopy(url); }
}

function fallbackCopy(url) {
  const textArea = document.createElement("textarea"); textArea.value = url; document.body.appendChild(textArea); textArea.select();
  try { document.execCommand('copy'); showToast("已複製對戰連結，快去貼給朋友！"); } catch (err) { showToast("複製失敗，請手動複製網址。"); }
  document.body.removeChild(textArea);
}

// 📌 離開房間防呆確認
function confirmLeave() {
  SFX.play('flip', false);
  document.getElementById('requestModal').style.display = 'block';
  document.getElementById('requestTitle').innerText = "確認離開";
  document.getElementById('requestText').innerText = "確定要離開房間嗎？這將中斷目前的對戰。";
  document.getElementById('btnReqYes').onclick = () => { document.getElementById('requestModal').style.display = 'none'; leaveRoom(true); };
  document.getElementById('btnReqNo').onclick = () => { document.getElementById('requestModal').style.display = 'none'; };
}

function leaveRoom(manual = false) {
  if (localUI.conn && localUI.conn.open) localUI.conn.send({ type: 'LEAVE' });
  if (localUI.peer) { localUI.peer.destroy(); } 
  if (manual) setTimeout(() => window.location.href = window.location.pathname, 100);
}

function proposeDraw() {
  if (gameState.winner || !gameState.roles.host || gameState.phase !== 'PLAYING') return;
  if (localUI.conn && localUI.conn.open) {
    localUI.conn.send({ type: 'REQUEST', action: 'DRAW' }); showToast("已發送求和請求，等待回應...");
  }
}

function confirmResign() {
  if (gameState.winner || !gameState.roles.host || gameState.phase !== 'PLAYING') return;
  SFX.play('flip', false);
  document.getElementById('requestModal').style.display = 'block';
  document.getElementById('requestTitle').innerText = "確認認輸";
  document.getElementById('requestText').innerText = "放棄本局遊戲並承認落敗嗎？";
  document.getElementById('btnReqYes').onclick = () => { document.getElementById('requestModal').style.display = 'none'; executeResign(); };
  document.getElementById('btnReqNo').onclick = () => { document.getElementById('requestModal').style.display = 'none'; };
}

function executeResign() {
  const oppColor = getMyColor() === 'red' ? 'black' : 'red';
  gameState.winner = oppColor; gameState.phase = 'ENDED';
  if (localUI.conn && localUI.conn.open) localUI.conn.send({ type: 'RESIGN' });
  syncAndRender();
}

function showDrawRequest() {
  SFX.play('move', false);
  document.getElementById('requestModal').style.display = 'block';
  document.getElementById('requestTitle').innerText = "對手求和";
  document.getElementById('requestText').innerText = "對手向您提出和局，是否同意？";
  document.getElementById('btnReqYes').onclick = () => {
     document.getElementById('requestModal').style.display = 'none';
     if (localUI.conn && localUI.conn.open) localUI.conn.send({ type: 'RESPONSE', action: 'DRAW', agree: true });
     gameState.winner = 'draw'; gameState.phase = 'ENDED'; syncAndRender();
  };
  document.getElementById('btnReqNo').onclick = () => {
     document.getElementById('requestModal').style.display = 'none';
     if (localUI.conn && localUI.conn.open) localUI.conn.send({ type: 'RESPONSE', action: 'DRAW', agree: false });
  };
}

function getValidMoves(idx, comboOnly = false) {
  const p = gameState.board[idx]; if (!p || !p.revealed) return [];
  const moves = [], r = Math.floor(idx / 8), c = idx % 8, dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  if (!p.isCannon) {
    dirs.forEach(([dr, dc]) => {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < 4 && nc >= 0 && nc < 8) {
        const tIdx = nr * 8 + nc, target = gameState.board[tIdx];
        if (!target) { if (!comboOnly) moves.push(tIdx); }
        else { if (!target.revealed) moves.push(tIdx); else if (target.color !== p.color && canCapture(p, target)) moves.push(tIdx); }
      }
    });
  } else {
    dirs.forEach(([dr, dc]) => {
      let nr = r + dr, nc = c + dc, screenFound = false;
      while (nr >= 0 && nr < 4 && nc >= 0 && nc < 8) {
        const tIdx = nr * 8 + nc, target = gameState.board[tIdx];
        if (!screenFound) {
          if (!target) { if (!comboOnly && Math.abs(nr - r) + Math.abs(nc - c) === 1) moves.push(tIdx); } else screenFound = true;
        } else {
          if (target) { if (!target.revealed) moves.push(tIdx); else if (target.color !== p.color) moves.push(tIdx); break; }
        }
        nr += dr; nc += dc;
      }
    });
  }
  return moves;
}

function canCapture(attacker, defender) {
  if (attacker.rank === 1 && defender.rank === 7) return true; 
  if (attacker.rank === 7 && defender.rank === 1) return false; 
  return attacker.rank >= defender.rank;
}

function onCellClick(idx) {
  if (gameState.winner || !isMyTurn() || localUI.locked || gameState.phase !== 'PLAYING') return;
  const p = gameState.board[idx];
  const validMoves = localUI.selectedIndex !== null ? getValidMoves(localUI.selectedIndex, gameState.combo.active) : [];

  if (gameState.combo.active) {
    if (idx === gameState.combo.idx) { localUI.selectedIndex = idx; render(); } 
    else if (localUI.selectedIndex === gameState.combo.idx && validMoves.includes(idx)) executeAction(localUI.selectedIndex, idx); 
    return;
  }

  if (p && !p.revealed && localUI.selectedIndex === null) {
    SFX.play('flip', true); 
    gameState.board[idx].revealed = true;
    gameState.lastMoveTarget = idx; 
    
    if (!gameState.roles.host) {
      const firstColor = p.color, secondColor = firstColor === 'red' ? 'black' : 'red';
      gameState.roles.host = localUI.isHost ? firstColor : secondColor;
      gameState.roles.guest = localUI.isHost ? secondColor : firstColor;
      gameState.turn = secondColor; 
    } else { gameState.turn = (gameState.turn === 'red') ? 'black' : 'red'; }
    localUI.selectedIndex = null; syncAndRender();
  } 
  else if (p && p.revealed && p.color === getMyColor()) {
    localUI.selectedIndex = (localUI.selectedIndex === idx) ? null : idx; render();
  } 
  else if (localUI.selectedIndex !== null && validMoves.includes(idx)) {
    executeAction(localUI.selectedIndex, idx);
  }
}

function executeAction(from, to) {
  const targetPiece = gameState.board[to];
  const isDarkCapture = targetPiece && !targetPiece.revealed;
  gameState.lastMoveTarget = to; 

  if (isDarkCapture) {
    targetPiece.revealed = true; gameState.combat = { from, to }; localUI.locked = true; syncAndRender();
    setTimeout(() => { resolveCombat(from, to, true); }, 1200); 
  } else { resolveCombat(from, to, false); }
}

function resolveCombat(from, to, wasDark) {
  const attacker = gameState.board[from], defender = gameState.board[to];
  gameState.combat = null; localUI.locked = false;

  if (defender) {
    const isValid = (defender.color !== attacker.color) && (attacker.isCannon || canCapture(attacker, defender));
    if (isValid) {
      if (defender.rank === 7 || defender.rank === 4 || defender.isCannon) SFX.play('captureBig', true); else SFX.play('capture', true);
      if (!gameState.dead[defender.color][defender.name]) gameState.dead[defender.color][defender.name] = 0;
      gameState.dead[defender.color][defender.name]++;
      gameState.board[to] = attacker; gameState.board[from] = null; localUI.selectedIndex = null;

      if (getValidMoves(to, true).length > 0) {
        SFX.play('combo', true); gameState.combo.active = true; gameState.combo.idx = to; localUI.selectedIndex = to; checkWin(); syncAndRender(); return; 
      }
    } else {
      SFX.play('fail', true); 
      if (isMyTurn()) showToast("盲吃失敗！階級不足或遇到友軍。");
      localUI.selectedIndex = null;
    }
  } else {
    SFX.play('move', true); gameState.board[to] = attacker; gameState.board[from] = null; localUI.selectedIndex = null;
  }
  
  gameState.combo = { active: false, idx: null }; gameState.turn = (gameState.turn === 'red') ? 'black' : 'red';
  checkWin(); syncAndRender();
}

function manualEndCombo() {
  if (!gameState.combo.active || !isMyTurn() || localUI.locked || gameState.phase !== 'PLAYING') return;
  gameState.combo = { active: false, idx: null }; localUI.selectedIndex = null;
  gameState.turn = (gameState.turn === 'red') ? 'black' : 'red'; syncAndRender();
}

function checkWin() {
  if (!gameState.roles.host || gameState.winner) return;
  const redCount = gameState.board.filter(p => p && p.color === 'red').length;
  const blackCount = gameState.board.filter(p => p && p.color === 'black').length;
  if (redCount === 0) { gameState.winner = 'black'; gameState.phase = 'ENDED'; }
  if (blackCount === 0) { gameState.winner = 'red'; gameState.phase = 'ENDED'; }
}

function isMyTurn() {
  if (gameState.winner) return false;
  const myColor = getMyColor();
  if (!myColor) return gameState.firstPlayer === (localUI.isHost ? 'host' : 'guest');
  return gameState.turn === myColor;
}

function getMyColor() { return localUI.isHost ? gameState.roles.host : gameState.roles.guest; }

function requestRematch() {
  const myRole = localUI.isHost ? 'host' : 'guest';
  gameState.rematch[myRole] = true;
  if (localUI.isHost && gameState.rematch.host && gameState.rematch.guest) triggerRestart(); else syncAndRender();
}

// 📌 修復：再來一局卡死問題
function triggerRestart() { 
  initGame(); // 產生新局 ID 與乾淨狀態
  gameState.phase = 'RPS'; 
  gameState.firstPlayer = Math.random() > 0.5 ? 'host' : 'guest'; 
  localUI.currentMatchId = gameState.matchId; // 主機必須更新本地 MatchId
  
  document.getElementById('sysModal').style.display = 'none'; // 隱藏結算
  
  syncAndRender(); // 廣播新局
  startRpsAnimation(gameState.firstPlayer === 'host'); // 主機自己也要呼叫猜拳動畫
}

function showToast(msg) {
  const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block';
  setTimeout(() => t.style.opacity = 1, 10); setTimeout(() => { t.style.opacity = 0; setTimeout(() => t.style.display = 'none', 300); }, 2500);
}

function render() {
  const myColor = getMyColor();
  const oppColor = myColor === 'red' ? 'black' : (myColor === 'black' ? 'red' : null);
  
  document.getElementById('myActionBtns').style.display = (gameState.roles.host && !gameState.winner && gameState.phase === 'PLAYING') ? 'flex' : 'none';
  document.getElementById('btnComboEnd').style.display = (gameState.combo.active && isMyTurn() && !localUI.locked && gameState.phase === 'PLAYING') ? 'block' : 'none';
  
  document.getElementById('btnLeave').style.display = (gameState.phase !== 'LOBBY') ? 'flex' : 'none';

  let statusText = "";
  if (gameState.winner) { 
    if (gameState.winner === 'draw') statusText = `雙方協議平局！`; else statusText = `遊戲結束，${gameState.winner === 'red' ? '紅方' : '黑方'}勝出！`;
    document.getElementById('sysModalTitle').innerText = statusText;
    const myRole = localUI.isHost ? 'host' : 'guest', oppRole = localUI.isHost ? 'guest' : 'host';
    const btn = document.getElementById('btnRematch'), status = document.getElementById('rematchStatus');
    
    if (!localUI.gameOverSoundPlayed) {
      localUI.gameOverSoundPlayed = true;
      if (gameState.winner === 'draw') SFX.play('flip', false);
      else if (gameState.winner === myColor) setTimeout(() => SFX.play('win', false), 500);
      else setTimeout(() => SFX.play('lose', false), 500);
    }
    
    if (gameState.rematch[myRole]) { btn.disabled = true; btn.innerText = "已準備"; status.innerText = gameState.rematch[oppRole] ? "雙方同意，準備載入..." : "等待對方同意...";
    } else { btn.disabled = false; btn.innerText = "再來一局"; status.innerText = gameState.rematch[oppRole] ? "對手已準備，你想再來一局嗎？" : "選擇是否要再來一局"; }
    document.getElementById('sysModal').style.display = 'block';
    
  } else if (gameState.combat) { statusText = "💥 盲吃判定中..."; 
  } else if (gameState.phase === 'RPS') { statusText = "✊ 猜拳決定先手..."; document.getElementById('sysModal').style.display = 'none';
  } else if (!myColor) { statusText = "第一步：請翻開首枚棋子"; document.getElementById('sysModal').style.display = 'none'; 
  } else { statusText = isMyTurn() ? "👉 換您行動" : "⏳ 等待對手..."; if (gameState.combo.active) statusText += " (連吃中)"; document.getElementById('sysModal').style.display = 'none'; }
  
  document.getElementById('gameStatus').innerText = statusText;

  document.getElementById('panelMe').className = `player-panel ${isMyTurn() && !localUI.locked && gameState.phase === 'PLAYING' ? 'active-turn' : ''}`;
  document.getElementById('panelOpponent').className = `player-panel ${!isMyTurn() && !localUI.locked && gameState.phase === 'PLAYING' && myColor ? 'active-turn' : ''}`;

  document.getElementById('myRoleBadge').className = 'role-badge ' + (myColor || '');
  document.getElementById('myRoleBadge').innerText = `我方 (${myColor === 'red' ? '紅' : (myColor === 'black' ? '黑' : '未定')})`;
  document.getElementById('oppRoleBadge').className = 'role-badge ' + (oppColor || '');
  document.getElementById('oppRoleBadge').innerText = `對手 (${oppColor === 'red' ? '紅' : (oppColor === 'black' ? '黑' : '未定')})`;

  renderDeadPieces('myCaptured', oppColor); renderDeadPieces('oppCaptured', myColor);

  const boardEl = document.getElementById('board'); boardEl.innerHTML = '';
  const validMoves = localUI.selectedIndex !== null && !localUI.locked && gameState.phase === 'PLAYING' ? getValidMoves(localUI.selectedIndex, gameState.combo.active) : [];

  for (let i = 0; i < 32; i++) {
    const cell = document.createElement('div'); cell.className = 'cell';
    if (validMoves.includes(i)) cell.classList.add(gameState.board[i] !== null ? 'target-capture' : 'target-move');
    cell.onclick = () => onCellClick(i);

    const p = gameState.board[i];
    if (p) {
      const pEl = document.createElement('div'); pEl.className = 'piece';
      if (!p.revealed) pEl.classList.add('hidden'); else { pEl.classList.add('revealed', p.color); pEl.innerText = p.name; }
      
      if (i === localUI.selectedIndex) pEl.classList.add('selected');
      if (gameState.combo.active && i === gameState.combo.idx) pEl.classList.add('combo-active');
      if (gameState.combat) { if (i === gameState.combat.from) pEl.classList.add('combat-attacker'); if (i === gameState.combat.to) pEl.classList.add('combat-defender'); }
      
      if (i === gameState.lastMoveTarget) pEl.classList.add('last-move');

      cell.appendChild(pEl);
    }
    boardEl.appendChild(cell);
  }
}

function renderDeadPieces(containerId, color) {
  const container = document.getElementById(containerId); container.innerHTML = '';
  if (!color) { container.innerHTML = '<span style="color:#888; font-size:12px;">尚未取得軍牌</span>'; return; }
  
  const dList = gameState.dead[color]; let hasPieces = false;
  for (let name in dList) {
    if (dList[name] > 0) {
      hasPieces = true; const span = document.createElement('span'); span.className = `captured-item ${color}`;
      span.innerText = `${name} ×${dList[name]}`; container.appendChild(span);
    }
  }
  if (!hasPieces) container.innerHTML = '<span style="color:#888; font-size:12px;">無折損</span>';
}

function syncAndRender() { if (localUI.conn && localUI.conn.open) localUI.conn.send({ type: 'SYNC', state: gameState }); render(); }

function handleIncomingData(data) {
  if (data.type === 'SFX') { SFX.play(data.sound, false); return; }
  if (data.type === 'REQUEST' && data.action === 'DRAW') { showDrawRequest(); return; }
  if (data.type === 'RESPONSE' && data.action === 'DRAW') {
    if (data.agree) { gameState.winner = 'draw'; gameState.phase = 'ENDED'; showToast("對手同意和局！"); syncAndRender(); } 
    else showToast("對手拒絕了您的求和。"); return;
  }
  if (data.type === 'RESIGN') { gameState.winner = getMyColor(); gameState.phase = 'ENDED'; showToast("對手已認輸！"); syncAndRender(); return; }
  if (data.type === 'LEAVE') { 
    showToast("對方已離開房間，連線中斷。"); 
    if(localUI.peer) localUI.peer.destroy(); 
    setTimeout(() => window.location.href = window.location.pathname, 2500); 
    return; 
  }

  if (data.type === 'SYNC') {
    const isNewMatch = gameState.matchId !== data.state.matchId;
    gameState = data.state; localUI.locked = !!gameState.combat;
    
    // 📌 修正：嚴格判定新局接收機制
    if (isNewMatch) {
       localUI.currentMatchId = gameState.matchId; 
       
       document.getElementById('lobby').style.display = 'none'; 
       document.getElementById('sysModal').style.display = 'none'; 
       document.getElementById('requestModal').style.display = 'none'; 
       document.getElementById('gameApp').style.display = 'flex'; // 橫式會在 CSS grid 覆蓋
       
       if (gameState.firstPlayer) startRpsAnimation(gameState.firstPlayer === 'host');
    } else {
       // 只有非新局時，才去判斷雙方是否都按了再來一局
       if (localUI.isHost && gameState.winner && gameState.rematch.host && gameState.rematch.guest) { triggerRestart(); return; }
    }
    
    if (gameState.phase === 'PLAYING') {
      if (!isMyTurn() || !gameState.combo.active) localUI.selectedIndex = null;
      else if (gameState.combo.active && isMyTurn() && !localUI.locked) localUI.selectedIndex = gameState.combo.idx; 
    }
    render();
  }
}

function startRpsAnimation(hostWin) {
  const m = document.getElementById('rpsModal'), h = document.getElementById('rpsHost'), g = document.getElementById('rpsGuest'), r = document.getElementById('rpsResult');
  m.style.display = 'flex'; r.innerText = '系統決定中...';
  
  gameState.phase = 'RPS';
  localUI.locked = true; 
  
  const gestures = ['✊', '✌️', '🖐️']; let count = 0;
  let interval = setInterval(() => {
    SFX.play('move', false); 
    h.innerText = gestures[Math.floor(Math.random() * 3)]; g.innerText = gestures[Math.floor(Math.random() * 3)]; count++;
    if (count > 15) {
      clearInterval(interval); SFX.play('flip', false);
      if (hostWin) { h.innerText = '✊'; g.innerText = '✌️'; r.innerText = '房主贏得首翻權！'; } else { h.innerText = '✌️'; g.innerText = '✊'; r.innerText = '棋客贏得首翻權！'; }
      setTimeout(() => { 
        m.style.display = 'none'; 
        localUI.locked = false; 
        if(localUI.isHost) { 
           gameState.phase = 'PLAYING'; 
           syncAndRender(); 
        } else { render(); }
      }, 2200);
    }
  }, 100);
}

function joinRoom() {
  if (localUI.isConnecting) return;
  if (actx.state === 'suspended') actx.resume();
  const code = document.getElementById('roomId').value.trim();
  if (!code) { document.getElementById('lobbyMsg').innerText = "請輸入序號"; return; }
  
  localUI.isConnecting = true;
  document.getElementById('btnConnect').style.display = 'none';
  document.getElementById('btnShare').style.display = 'none';
  document.getElementById('btnCancel').style.display = 'block';
  document.getElementById('lobbyMsg').innerText = "連線中，若太久沒反應請按取消重試...";

  const hostPeerId = `dchess_sfx_${code}_host`; localUI.peer = new Peer();
  localUI.peer.on('open', () => {
    let testConn = localUI.peer.connect(hostPeerId); let joined = false;
    testConn.on('open', () => { joined = true; localUI.conn = testConn; localUI.isHost = false; setupConnEvents(); });
    setTimeout(() => { if (!joined && localUI.isConnecting) { testConn.close(); localUI.peer.destroy(); setupAsHost(code); } }, 2000);
  });
}

function setupAsHost(code) {
  localUI.peer = new Peer(`dchess_sfx_${code}_host`);
  localUI.peer.on('open', () => { 
    localUI.isHost = true; 
    initGame(); 
    document.getElementById('lobbyMsg').innerText = "已開房！等待對方連線..."; 
  });
  localUI.peer.on('connection', (c) => {
    if (!localUI.isConnecting) return;
    localUI.conn = c; setupConnEvents(); 
    
    initGame(); // 📌 強制重置棋盤狀態，避免有人斷線重連看到殘局
    
    gameState.firstPlayer = Math.random() > 0.5 ? 'host' : 'guest'; localUI.currentMatchId = gameState.matchId;
    gameState.phase = 'RPS';
    document.getElementById('lobby').style.display = 'none'; document.getElementById('gameApp').style.display = 'flex'; // 橫式有 CSS grid
    setTimeout(() => { syncAndRender(); startRpsAnimation(gameState.firstPlayer === 'host'); }, 500); 
  });
  localUI.peer.on('error', () => { if (localUI.isConnecting) { cancelRoom(); document.getElementById('lobbyMsg').innerText = "房號已被佔用或異常，請換一組號碼"; }});
}

function setupConnEvents() { 
  localUI.conn.on('data', handleIncomingData); 
  localUI.conn.on('close', () => { 
    showToast("對方已斷線，房間失效。"); 
    if(localUI.peer) localUI.peer.destroy();
    setTimeout(() => window.location.href = window.location.pathname, 2500); 
  }); 
}
